name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, compliance, marketplace, ai-agent, gateway, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase Repo Name
        shell: bash
        run: |
          echo "REPO_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Build Context & Dockerfile
        id: config
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=apps/frontend/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=./apps/backend" >> $GITHUB_OUTPUT
            echo "dockerfile=apps/backend/services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME_LOWER }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.REPO_NAME_LOWER }}/${{ matrix.service }}:${{ github.sha }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
